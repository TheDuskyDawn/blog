<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip | truncate: 160 }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
{% feed_meta %}
</head>
<body><main>
<nav><a href="https://theduskydawn.github.io/">← home</a> · <a href="{{ '/' | relative_url }}">blog</a></nav>
{{ content }}
<footer>TheDuskyDawn</footer>
</main></body></html>
